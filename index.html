<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CHAOS Ⅱ">
  <meta name="theme-color" content="#14171e">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <title>THE CHAOS Ⅱ</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #14171e; overflow: hidden; touch-action: none;
                 -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* 大きさは下の fitToViewport() が「実際に見えている範囲」に合わせる(100% / 100vh だと
       スマホのブラウザでアドレスバー・タブの下に潜り込み、上端が隠れるため)。CSS 側は dvh を既定値にしておく */
    #unity-container { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #14171e; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
               color: #ddd; font-family: sans-serif; font-size: 16px; }
    #bar { width: 60%; max-width: 360px; height: 8px; background: #333; border-radius: 4px; margin-top: 12px; overflow: hidden; }
    #bar > div { height: 100%; width: 0; background: #f8c040; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #14171e;
              color: #ddd; font-family: sans-serif; font-size: 20px; text-align: center; z-index: 10; }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    /* iPhone 向けの「ホーム画面に追加」の案内(全画面にする手段がこれしかない) */
    #ios-hint { display: none; position: fixed; inset: 0; z-index: 20; background: rgba(8, 9, 12, .92); color: #eee;
                font-family: sans-serif; align-items: center; justify-content: center; }
    #ios-hint .box { max-width: 560px; margin: 0 16px; padding: 18px 22px; border: 1px solid #8a6d2b; border-radius: 10px;
                     background: #1d2029; font-size: 15px; line-height: 1.7; }
    #ios-hint h2 { margin: 0 0 6px; font-size: 18px; color: #f8c040; }
    #ios-hint ol { margin: 6px 0 12px; padding-left: 1.4em; }
    #ios-hint .buttons { text-align: right; }
    #ios-hint button { margin-left: 10px; padding: 8px 16px; border: 0; border-radius: 6px; font-size: 15px; font-weight: bold; }
    #ios-hint .later { background: #444; color: #eee; }
    #ios-hint .ok { background: #f8c040; color: #000; }
  </style>
</head>
<body>
  <div id="unity-container"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><div>読み込み中…</div><div id="bar"><div id="barFill"></div></div></div>
  <div id="rotate">横向きにしてください<br><span style="font-size:14px;opacity:.7">(このゲームは横画面専用です)</span></div>
  <div id="ios-hint">
    <div class="box">
      <h2>全画面で遊ぶには(おすすめ)</h2>
      iPhone の Safari では、上のタブやアドレスバーが画面を狭くします。ホーム画面に追加すると、ブラウザの枠なしの全画面で遊べます。
      <ol>
        <li>Safari の <b>共有ボタン</b>(四角から上向きの矢印)を押す</li>
        <li><b>「ホーム画面に追加」</b>を選ぶ</li>
        <li>ホーム画面にできた <b>CHAOS Ⅱ</b> のアイコンから起動する</li>
      </ol>
      <div class="buttons">
        <button class="later" onclick="hideIosHint(true)">このまま遊ぶ</button>
        <button class="ok" onclick="hideIosHint(false)">分かった</button>
      </div>
    </div>
  </div>
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    var isIOS = /iP(hone|od)/.test(navigator.userAgent);
    var standalone = window.navigator.standalone === true || window.matchMedia("(display-mode: standalone)").matches
                     || window.matchMedia("(display-mode: fullscreen)").matches;
    var isTouch = window.matchMedia("(pointer: coarse)").matches;

    // 見えている範囲(アドレスバー・タブ・ツールバーを除いた部分)にゲームの枠を合わせる。
    // スマホのブラウザは 100% / 100vh が「バーが隠れたときの高さ」になり、上端がタブの下に潜ることがある
    function fitToViewport() {
      var c = document.getElementById("unity-container");
      var vv = window.visualViewport;
      var w = vv ? vv.width : window.innerWidth;
      var h = vv ? vv.height : window.innerHeight;
      c.style.width = Math.round(w) + "px";
      c.style.height = Math.round(h) + "px";
      c.style.left = Math.round(vv ? vv.offsetLeft : 0) + "px";
      c.style.top = Math.round(vv ? vv.offsetTop : 0) + "px";
      if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
    }
    fitToViewport();
    window.addEventListener("resize", fitToViewport);
    window.addEventListener("orientationchange", function () { setTimeout(fitToViewport, 300); });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", fitToViewport);
      window.visualViewport.addEventListener("scroll", fitToViewport);
    }

    // スマホ(Android など全画面 API が使える端末)は、最初のタップで全画面 + 横向き固定にする。
    // 全画面は利用者の操作の中でしか始められないため、最初の 1 回だけ。その後は設定画面の「全画面」で切り替える
    (function () {
      if (!isTouch || standalone) return;
      var el = document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) return;   // iPhone の Safari は非対応(下の案内でホーム画面への追加を勧める)
      function goFullscreen() {
        document.removeEventListener("pointerup", goFullscreen, true);
        if (document.fullscreenElement || document.webkitFullscreenElement) return;
        try {
          var p = req.call(el, { navigationUI: "hide" });
          var lock = function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); };
          if (p && p.then) p.then(lock).catch(function () {}); else lock();
        } catch (e) { }
      }
      document.addEventListener("pointerup", goFullscreen, true);
    })();

    // iPhone の Safari(ホーム画面から起動していない場合)は、ホーム画面への追加を案内する。「このまま遊ぶ」を選んだら次からは出さない
    function hideIosHint(remember) {
      document.getElementById("ios-hint").style.display = "none";
      if (remember) { try { localStorage.setItem("iosHintDismissed", "1"); } catch (e) { } }
    }
    (function () {
      if (!isIOS || standalone) return;
      var dismissed = false;
      try { dismissed = localStorage.getItem("iosHintDismissed") === "1"; } catch (e) { }
      if (!dismissed) document.getElementById("ios-hint").style.display = "flex";
    })();
  </script>
  <script src="Build/webgl.loader.js?v=77fcc13-202427"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var config = {
      arguments: [],
      dataUrl: "Build/webgl.data.unityweb?v=77fcc13-202427",
      frameworkUrl: "Build/webgl.framework.js.unityweb?v=77fcc13-202427",
      codeUrl: "Build/webgl.wasm.unityweb?v=77fcc13-202427",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "cardgame",
      productName: "THE CHAOS Ⅱ",
      productVersion: "0.1.0",
    };
    // 画面の実際の画素数で描く(以前は上限 2 で、iPhone(3 倍)では 2/3 の解像度を引き伸ばしてぼやけていた)。
    // 3 を超える端末は 3 で止める(2D の画面なので 3 倍で十分に細かい)
    config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 3);

    createUnityInstance(canvas, config, function (p) {
      document.querySelector("#barFill").style.width = Math.round(p * 100) + "%";
    }).then(function (instance) {
      document.querySelector("#loading").style.display = "none";
    }).catch(function (message) {
      document.querySelector("#loading").textContent = "読み込みに失敗しました: " + message;
    });
  </script>
</body>
</html>
